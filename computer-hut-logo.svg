<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 400 400" width="400" height="400" role="img" aria-label="The Computer Hut badge logo" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <path id="chTop" d="M40,200 A160,160 0 0 1 360,200"/>
    <path id="chBot" d="M40,200 A160,160 0 0 0 360,200"/>
  </defs>

  <!-- badge -->
  <circle cx="200" cy="200" r="196" fill="#176b4c"/>
  <circle cx="200" cy="200" r="187" fill="none" stroke="#f3ecd8" stroke-width="3"/>
  <circle cx="200" cy="200" r="132" fill="#f3ecd8"/>
  <circle cx="200" cy="200" r="132" fill="none" stroke="#0e2a20" stroke-width="2" opacity="0.2"/>

  <!-- ring text -->
  <g font-family="Arial, Helvetica, sans-serif" font-weight="700">
    <text fill="#f3ecd8" font-size="29" letter-spacing="4" text-anchor="middle"><textPath xlink:href="#chTop" startOffset="50%">THE COMPUTER HUT</textPath></text>
    <text fill="#f3ecd8" font-size="21" letter-spacing="3" text-anchor="middle"><textPath xlink:href="#chBot" startOffset="50%">FREE WIFI &#183; HOT BYTES</textPath></text>
  </g>

  <!-- side stars -->
  <g fill="#e8a33d">
    <path d="M52,200 L42.83,202.83 L40,212 L37.17,202.83 L28,200 L37.17,197.17 L40,188 L42.83,197.17 Z"/>
    <path d="M372,200 L362.83,202.83 L360,212 L357.17,202.83 L348,200 L357.17,197.17 L360,188 L362.83,197.17 Z"/>
  </g>

  <!-- emblem: the hut + computer -->
  <g>
    <!-- steam -->
    <g fill="none" stroke="#e8a33d" stroke-width="4" stroke-linecap="round">
      <path d="M190,150 q-7,-9 0,-18 q7,-9 0,-18"/>
      <path d="M210,150 q7,-9 0,-18 q-7,-9 0,-18"/>
    </g>
    <!-- roof -->
    <path d="M147,198 L200,150 L253,198" fill="none" stroke="#176b4c" stroke-width="11" stroke-linejoin="round" stroke-linecap="round"/>
    <!-- monitor body -->
    <rect x="166" y="196" width="68" height="46" rx="7" fill="#176b4c"/>
    <!-- screen -->
    <rect x="174" y="203" width="52" height="32" rx="3" fill="#f3ecd8"/>
    <!-- terminal prompt -->
    <text x="200" y="226" font-family="'Courier New', monospace" font-weight="700" font-size="20" fill="#176b4c" text-anchor="middle">&gt;_</text>
    <!-- stand -->
    <rect x="193" y="242" width="14" height="7" fill="#176b4c"/>
    <rect x="178" y="249" width="44" height="7" rx="3" fill="#176b4c"/>
  </g>
</svg>
